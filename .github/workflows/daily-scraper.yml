name: Daily Job Scraper

on:
  schedule:
    # 7:50 AM IST (2:20 AM UTC) - Off-peak minute avoids GitHub dropped queues
    - cron: '20 2 * * *'
    # 8:20 AM IST (2:50 AM UTC) - Backup run if morning queue was delayed
    - cron: '50 2 * * *'
  workflow_dispatch:  # Manual button for testing anytime

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Restore cache
      uses: actions/cache@v4
      with:
        path: jobs_cache.json
        key: jobs-cache-${{ github.run_id }}
        restore-keys: |
          jobs-cache-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run job scraper
      env:
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        JOBSCRAPER: ${{ secrets.JOBSCRAPER }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        KEYWORDS: ${{ secrets.KEYWORDS }}
        LOCATIONS: ${{ secrets.LOCATIONS }}
        EXPERIENCE_LEVEL: ${{ secrets.EXPERIENCE_LEVEL }}
        MAX_JOBS_PER_SOURCE: 50
        DAYS_BACK: 1
      run: |
        python main.py

    - name: Upload cache artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: jobs-cache
        path: jobs_cache.json
        retention-days: 7
        if-no-files-found: ignore
