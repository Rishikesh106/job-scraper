name: Daily Job Scraper

on:
  schedule:
    # Runs automatically every morning at 8:00 AM IST (2:30 AM UTC)
    - cron: '30 2 * * *'
  workflow_dispatch:  # Optional manual button for testing anytime

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run job scraper
      env:
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        JOBSCRAPER: ${{ secrets.JOBSCRAPER }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        KEYWORDS: ${{ secrets.KEYWORDS }}
        LOCATIONS: ${{ secrets.LOCATIONS }}
        EXPERIENCE_LEVEL: ${{ secrets.EXPERIENCE_LEVEL }}
        MAX_JOBS_PER_SOURCE: 50
        DAYS_BACK: 1
      run: |
        python main.py

    - name: Upload cache
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: jobs-cache
        path: jobs_cache.json
        retention-days: 7
        if-no-files-found: ignore
